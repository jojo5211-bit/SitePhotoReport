name: site_photo_mobile
description: "工程照片整理器手機版 — 工地現場拍照、快速分類、匯出報告"
publish_to: 'none'
version: 1.1.0+11

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  provider: ^6.1.2
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  intl: ^0.19.0
  permission_handler: ^11.3.1
  image: ^4.3.0
  crypto: ^3.0.6
  pdf: ^3.11.1
  printing: ^5.13.4
  open_filex: ^4.7.0
  shared_preferences: ^2.3.3
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSansTC.ttf
